<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Loading...</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="icon" type="image/svg+xml" href="../assets/icon.svg" />
        <link rel="stylesheet" href="./index.css">
        <meta name="robots" content="index, follow">
    </head>
    <body>
        <mdui-top-app-bar scroll-behavior="elevate">
            <mdui-button-icon class="sidebar-open-btn">
                <mdui-icon-menu></mdui-icon-menu>
            </mdui-button-icon>
            <mdui-top-app-bar-title><!----></mdui-top-app-bar-title>
        </mdui-top-app-bar>

        <mdui-navigation-drawer modal close-on-overlay-click close-on-esc class="sidebar">
            <div class="v-box">
                <mdui-list>
                    <mdui-list-item nonclickable>
                        <div slot="description" class="h-box">
                            <mdui-avatar></mdui-avatar>
                            <span><!----></span>
                        </div>
                    </mdui-list-item>
                    <mdui-list-item rounded href="../">
                        <mdui-icon-home slot="icon"></mdui-icon-home>
                        <span><!----></span>
                    </mdui-list-item>
                    <mdui-list-item rounded active>
                        <mdui-icon-badge slot="icon"></mdui-icon-badge>
                        <span><!----></span>
                    </mdui-list-item>
                    <mdui-list-item rounded href="../links/">
                        <mdui-icon-link slot="icon"></mdui-icon-link>
                        <span><!----></span>
                    </mdui-list-item>
                    <mdui-list-item rounded href="../blog/">
                        <mdui-icon-article slot="icon"></mdui-icon-article>
                        <span><!----></span>
                    </mdui-list-item>
                </mdui-list>
                <div class="v-box">
                    <div class="h-box glb-ctrl">
                        <mdui-tooltip content="">
                            <mdui-button-icon><mdui-icon-light></mdui-icon-light></mdui-button-icon>
                        </mdui-tooltip>
                        <mdui-tooltip content="">
                            <mdui-button-icon><mdui-icon-translate></mdui-icon-translate></mdui-button-icon>
                        </mdui-tooltip>
                        <mdui-tooltip content="">
                            <mdui-button-icon><mdui-icon-wallpaper></mdui-icon-wallpaper></mdui-button-icon>
                        </mdui-tooltip>
                    </div>
                    <p class="footer"><!----></p>
                </div>
            </div>
        </mdui-navigation-drawer>

        <div class="v-box container">

            <div class="auto-box basic-info">
                <div class="v-box"> 
                    <mdui-avatar style="
                        width: 45vw;height: 45vw;
                        max-width: 30vh;max-height: 30vh;
                        margin-bottom: 10px;
                    "></mdui-avatar>
                    <h1></h1>
                    <p style="font-size: 1em;"></p>
                    <mdui-divider style="width: 100%; margin: 10px;"></mdui-divider>
                    <p style="font-size: 1.12em;"></p>
                </div>
                <div class="v-box">
                    <h2 style="font-size: 1.45em;"></h2>
                    <div class="v-box">
                        <div class="bi-lns">
                            <p style="color: rgb(var(--mdui-color-outline));"></p>
                            <mdui-icon-wc style="color: rgb(var(--mdui-color-outline));"></mdui-icon-wc>
                        </div>
                        <div class="bi-lns">
                            <p style="color: rgb(var(--mdui-color-outline));"></p>
                            <mdui-icon-cake--outlined style="color: rgb(var(--mdui-color-outline));"></mdui-icon-cake--outlined>
                        </div>
                        <div class="bi-lns">
                            <p style="color: rgb(var(--mdui-color-outline));"></p>
                            <mdui-icon-favorite-border style="color: rgb(var(--mdui-color-outline));"></mdui-icon-favorite-border>
                        </div>
                        <div class="bi-lns">
                            <p style="color: rgb(var(--mdui-color-outline));"></p>
                            <mdui-icon-location-on--outlined style="color: rgb(var(--mdui-color-outline));"></mdui-icon-location-on--outlined>
                        </div>
                        <div class="bi-lns">
                            <p style="color: rgb(var(--mdui-color-outline));"></p>
                            <mdui-icon-more-horiz style="color: rgb(var(--mdui-color-outline));"></mdui-icon-more-horiz>
                        </div>
                    </div>
                </div>
            </div>

            <mdui-divider></mdui-divider>

            <mdui-card variant="filled" class="intros">
                <h3><!----></h3>
                <mdui-linear-progress></mdui-linear-progress>
                <p><!----></p>
                <mdui-fab>
                    <mdui-icon-shuffle slot="icon"></mdui-icon-shuffle>
                </mdui-fab>
            </mdui-card>

            <mdui-card variant="filled" class="sens">
                <h3><!----></h3>
                <mdui-linear-progress></mdui-linear-progress>
                <p><!----></p>
                <h6><!----></h6>
                <mdui-fab>
                    <mdui-icon-shuffle slot="icon"></mdui-icon-shuffle>
                </mdui-fab>
            </mdui-card>

            <mdui-divider></mdui-divider>


            <h2 class="lifelog-title">
                <span>Lifelog</span>
                <br/>
                <span class="lifelog-subtitle">Requesting...</span>
            </h2>

            <div class="auto-box lifelog-cards">
                <mdui-card variant="filled" class="lifelog-card-laptop">
                    <h3><!----></h3>
                    <p><!----></p>
                    <div class="h-box" style="gap: 5px;">
                        <mdui-chip>
                            <mdui-icon-memory slot="icon"></mdui-icon-memory>
                            <span><!----></span>
                        </mdui-chip>
                        <mdui-chip>
                            <mdui-icon-update slot="icon"></mdui-icon-update>
                            <span><!----></span>
                        </mdui-chip>
                    </div>
                    <mdui-collapse>
                        <mdui-collapse-item style="overflow-x: hidden;">
                            <mdui-list-item slot="header">
                                <mdui-icon-history slot="icon"></mdui-icon-history>
                                <span><!----></span>
                            </mdui-list-item>
                            
                            <table class="mdui-table lifelog-card-laptop-table" style="margin: 0; width: 100%;table-layout: fixed">
                                <thead>
                                    <tr>
                                        <th><!----></th>
                                        <th><!----></th>
                                        <th><!----></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!---->
                                </tbody>
                            </table>

                        </mdui-collapse-item>
                    </mdui-collapse>
                </mdui-card>

                <mdui-card variant="filled" class="lifelog-card-phone">
                    <h3><!----></h3>
                    <p><!----></p>
                    <div class="h-box" style="gap: 5px;">
                        <mdui-chip>
                            <mdui-icon-battery-0-bar slot="icon"></mdui-icon-battery-0-bar>
                            <span><!----></span>
                        </mdui-chip>
                        <mdui-chip>
                            <mdui-icon-update slot="icon"></mdui-icon-update>
                            <span><!----></span>
                        </mdui-chip>
                    </div>
                    <mdui-collapse>
                        <mdui-collapse-item style="overflow-x: hidden;">
                            <mdui-list-item slot="header">
                                <mdui-icon-history slot="icon"></mdui-icon-history>
                                <span><!----></span>
                            </mdui-list-item>

                            <table class="mdui-table lifelog-card-phone-table" style="margin: 0; width: 100%;table-layout: fixed">
                                <thead>
                                    <tr>
                                        <th><!----></th>
                                        <th><!----></th>
                                        <th><!----></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!---->
                                </tbody>
                            </table>

                        </mdui-collapse-item>
                    </mdui-collapse>
                </mdui-card>
            </div>


        </div>

        <script src="../global/global.ts" type="module"></script>
        <script src="./index.ts" type="module"></script>
    </body>
</html>
