<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/svg+xml" href="../assets/icon.svg" />
    <link rel="stylesheet" href="./index.css">
    <meta name="robots" content="index, follow">
</head>
<body>
    <mdui-top-app-bar scroll-behavior="elevate">
        <mdui-button-icon href="..">
            <mdui-icon-arrow-back></mdui-icon-arrow-back>
        </mdui-button-icon>
        <mdui-top-app-bar-title><!----></mdui-top-app-bar-title>
        <div style="flex-grow: 1"></div>
        <mdui-tooltip content="" placement="left">
            <mdui-button-icon class="ramd">
                <mdui-icon-shuffle></mdui-icon-shuffle>
            </mdui-button-icon>
        </mdui-tooltip>
    </mdui-top-app-bar>
    <div class="v-box container">
        <h1><!----></h1>
        <p><!----></p>
        
        <mdui-collapse><mdui-collapse-item>
            <mdui-list-item slot="header">
                <mdui-icon-filter-alt--outlined slot="icon"></mdui-icon-filter-alt--outlined>
                <div class="h-box">
                    <span><!----></span><mdui-badge><!----></mdui-badge>
                </div>
                <mdui-tooltip content="111" slot="end-icon" placement="left">
                    <mdui-switch>
                        <mdui-icon-grid-view--outlined slot="unchecked-icon"></mdui-icon-grid-view--outlined>
                        <mdui-icon-list slot="checked-icon"></mdui-icon-list>
                    </mdui-switch>
                </mdui-tooltip>
            </mdui-list-item>
            <div class="v-box">
                <div class="h-box filter-item-container"> 
                    <mdui-icon-search></mdui-icon-search>
                    <mdui-text-field variant="outlined"></mdui-text-field>
                </div>
                <div class="h-box filter-item-container">
                    <mdui-icon-category--outlined></mdui-icon-category--outlined>
                    <div class="h-box categories"></div>
                </div>
                <div class="h-box filter-item-container">
                    <mdui-icon-tag></mdui-icon-tag>
                    <div class="h-box tags"></div>
                </div>
            </div>
        </mdui-collapse-item></mdui-collapse>

        <mdui-divider></mdui-divider>
        <div class="v-box posts" style="gap: 20px;"></div>
    </div>
    {{ seo_area }}
    <script src="../global/global.ts" type="module"></script>
    <script src="./index.ts" type="module"></script>
</body>
</html>
