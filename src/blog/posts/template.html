<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ Title }}</title>
    <link rel="icon" href="../../../icon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="./template.css">
    <meta name="robots" content="index, follow">
</head>
<body>
    <mdui-top-app-bar scroll-behavior="elevate shrink" variant="large">
        <mdui-button-icon href="../../">
            <mdui-icon-arrow-back></mdui-icon-arrow-back>
        </mdui-button-icon>
        <mdui-button-icon class="sidebar-open-btn">
                <mdui-icon-menu></mdui-icon-menu>
            </mdui-button-icon>
        <mdui-top-app-bar-title>{{ Title }}</mdui-top-app-bar-title>
        <div style="flex-grow: 1"></div>
        <mdui-tooltip content="" placement="left">
            <mdui-button-icon class="open-content-drawer">
                <mdui-icon-menu-open></mdui-icon-menu-open>
            </mdui-button-icon>
        </mdui-tooltip>
    </mdui-top-app-bar>

    <mdui-navigation-drawer modal close-on-overlay-click close-on-esc class="sidebar">
        <div class="v-box">
            <mdui-list>
                <mdui-list-item nonclickable>
                    <div slot="description" class="h-box">
                        <mdui-avatar></mdui-avatar>
                        <span><!----></span>
                    </div>
                </mdui-list-item>
                <mdui-list-item rounded href="../../../">
                    <mdui-icon-home slot="icon"></mdui-icon-home>
                    <span><!----></span>
                </mdui-list-item>
                <mdui-list-item rounded href="../../../intro/">
                    <mdui-icon-badge slot="icon"></mdui-icon-badge>
                    <span><!----></span>
                </mdui-list-item>
                <mdui-list-item rounded href="../../../links/">
                    <mdui-icon-link slot="icon"></mdui-icon-link>
                    <span><!----></span>
                </mdui-list-item>
                <mdui-list-item rounded active href="../../">
                    <mdui-icon-article slot="icon"></mdui-icon-article>
                    <span><!----></span>
                </mdui-list-item>
            </mdui-list>
            <div class="v-box">
                <div class="h-box glb-ctrl">
                    <mdui-tooltip content="">
                        <mdui-button-icon><mdui-icon-light></mdui-icon-light></mdui-button-icon>
                    </mdui-tooltip>
                    <mdui-tooltip content="">
                        <mdui-button-icon><mdui-icon-translate></mdui-icon-translate></mdui-button-icon>
                    </mdui-tooltip>
                    <mdui-tooltip content="">
                        <mdui-button-icon><mdui-icon-wallpaper></mdui-icon-wallpaper></mdui-button-icon>
                    </mdui-tooltip>
                    <div></div>
                </div>
                <p class="footer"><!----></p>
            </div>
        </div>
    </mdui-navigation-drawer>

    <main>
        <div class="cate-tag">
            <mdui-tooltip placement="top">
                <mdui-chip variant="input">
                    <mdui-icon-description--outlined slot="icon"></mdui-icon-description--outlined>
                    <span></span>
                </mdui-chip>
                <div slot="content">
                    <span></span><span></span><br />
                    <span></span><span></span><br />
                    <span></span><span></span>
                </div>
            </mdui-tooltip>
        </div>
        <article class="mdui-prose article" id="article-content">
            {{ content }}
        </article>

        <div class="auto-box postnav">
            <mdui-tooltip class="newer-post" content=""> 
                <mdui-card disabled class="v-box" variant="outlined" clickable>
                    <span class="h-box"><mdui-icon-arrow-back></mdui-icon-arrow-back><span><!----></span></span>
                    <span class="other-post-title"><!----></span>
                </mdui-card>
            </mdui-tooltip>
            <div class="h-box postnav-part2">
                <mdui-tooltip content="" class="older-post">
                    <mdui-card disabled class="v-box" variant="outlined" clickable>
                        <span class="h-box"><span><!----></span><mdui-icon-arrow-forward></mdui-icon-arrow-forward></span>
                        <span class="other-post-title"><!----></span>
                    </mdui-card>
                </mdui-tooltip>
                <mdui-tooltip content="">
                    <mdui-card class="v-box rand-post" variant="outlined" clickable style="cursor: none !important;" disabled>
                        <mdui-icon><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M14 8C13.45 8 13 7.55 13 7S13.45 6 14 6C14.55 6 15 6.45 15 7C15 7.55 14.55 8 14 8M12 12V19H5V12H12M12.78 10H4.22C3.55 10 3 10.55 3 11.22V19.78C3 20.45 3.55 21 4.22 21H12.78C13.45 21 14 20.45 14 19.78V11.22C14 10.55 13.45 10 12.78 10M19.78 3H11.22C10.55 3 10 3.55 10 4.22V8H12V5H19V12H16V14H19.78C20.45 14 21 13.45 21 12.78V4.22C21 3.55 20.45 3 19.78 3M17 8C16.45 8 16 7.55 16 7S16.45 6 17 6C17.55 6 18 6.45 18 7C18 7.55 17.55 8 17 8M17 11C16.45 11 16 10.55 16 10S16.45 9 17 9C17.55 9 18 9.45 18 10C18 10.55 17.55 11 17 11M7 15C6.45 15 6 14.55 6 14S6.45 13 7 13C7.55 13 8 13.45 8 14C8 14.55 7.55 15 7 15M10 18C9.45 18 9 17.55 9 17S9.45 16 10 16C10.55 16 11 16.45 11 17C11 17.55 10.55 18 10 18" /></svg></mdui-icon>
                    </mdui-card>
                </mdui-tooltip>
            </div>
        </div>

        <div class="giscus"></div>
    </main>
    <aside>
        <mdui-navigation-drawer modal close-on-esc close-on-overlay-click placement="right">
            <mdui-list class="toc-list"></mdui-list>
        </mdui-navigation-drawer>
    </aside>
    <script src="./template.ts" type="module"></script>
    {{ toc_json }}
    {{ cate_tag_json }}
    {{ postnav_json }}
</body>
</html>
