<!DOCTYPE html>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404</title>
    <script>
        document.addEventListener("DOMContentLoaded", ()=>{
            const hostnames_ele = document.getElementById("hostnames");
            const hostnames = JSON.parse(hostnames_ele.textContent);
            const url = window.location.href;
            function findHostname(){
                for(let i=0;i<hostnames.length;i++){
                    if(url.startsWith(hostnames[i])){
                        return hostnames[i];
                    };
                };
                window.location.href = `../404.html`;
            };
            const hostname = findHostname();
            if(url!=`${hostname}/404.html` && url!=`${hostname}404.html`){
                if(/(?<!\d)\/20\d{2}\/(?!\d)/.test(window.location.pathname)){
                    window.location.href = `${hostname}${hostname.endsWith('/') ? '' : '/'}blog/?name=${window.location.pathname.split('/').filter(Boolean).pop() || ''}`;
                } else {
                    window.location.href = `${hostname}${hostname.endsWith('/') ? '' : '/'}404.html`;
                };
            };
        });
    </script>
